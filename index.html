
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>わが家の在庫管理</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f1f7f4;
      padding: 20px;
    }
    main {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 24px;
      border-radius: 16px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
    }
    li {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <main>
    <h1>🏠 わが家の在庫管理</h1>
    <p>家にある商品を記録しましょう。</p>

    <form id="form">
      <input id="name" placeholder="商品名" required>
      <input id="quantity" type="number" min="1"
             value="1" required>
      <button type="submit">登録する</button>
    </form>

    <details>
  <summary>在庫一覧を表示する</summary>
<ul id="list"></ul>
<button id="saveQuantityButton" type="button">変更をまとめて保存</button>
</details>
    
  </main>

  <script>
    const items = JSON.parse(
      localStorage.getItem("items") || "[]"
    );
const pendingQuantities = new Map();
    function showItems() {
      const list = document.getElementById("list");
      list.innerHTML = "";

      items.forEach((item, index) => {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = item.name + "：" + item.quantity + "個 ";

        const button = document.createElement("button");
        button.textContent = "削除";
        button.onclick = () => {
  if (pendingQuantities.size > 0) {
    alert("保存していない数量の変更があります。先に「変更をまとめて保存」を押してください。");
    return;
  }

  items.splice(index, 1);
  saveItems();
};

        // 在庫を1個減らすボタン
const decreaseButton = document.createElement("button");
decreaseButton.textContent = "－";
decreaseButton.onclick = () => {
  const current = pendingQuantities.has(index)
    ? pendingQuantities.get(index)
    : Number(item.quantity);

  const next = Math.max(0, current - 1);
  pendingQuantities.set(index, next);

  label.textContent = item.name + "：" + next + "個";
};

// 在庫を1個増やすボタン
const increaseButton = document.createElement("button");
increaseButton.textContent = "＋";
increaseButton.onclick = () => {
  const current = pendingQuantities.has(index)
    ? pendingQuantities.get(index)
    : Number(item.quantity);

  const next = current + 1;
  pendingQuantities.set(index, next);

  label.textContent = item.name + "：" + next + "個";
};

// 商品名、数量変更ボタン、削除ボタンを表示
li.append(label, decreaseButton, increaseButton, button);
        list.appendChild(li);
      });
    }

    function saveItems() {
      localStorage.setItem("items", JSON.stringify(items));
      showItems();
    }
// 変更した数量をまとめて保存する
document.getElementById("saveQuantityButton").onclick = () => {
  pendingQuantities.forEach((quantity, index) => {
    if (items[index]) {
      items[index].quantity = quantity;
    }
  });

  pendingQuantities.clear();
  saveItems();
  alert("数量の変更を保存しました");
};
    document.getElementById("form").onsubmit = (event) => {
      event.preventDefault();
if (pendingQuantities.size > 0) {
  alert("保存していない数量の変更があります。先に「変更をまとめて保存」を押してください。");
  return;
}
      const name = document.getElementById("name");
      const quantity = document.getElementById("quantity");

      
if (items.some(item => item.name === name.value.trim())) {
  alert("この商品はすでに在庫にあります。");
  return;
}

      items.push({
        name: name.value.trim(),
        quantity: Number(quantity.value)
      });

      saveItems();
      event.target.reset();
    };

    showItems();
  </script>
</body>
</html>
